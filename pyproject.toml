[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-analysis"
version = "2.0.0"
description = "NBA historical player analysis and lineup simulation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
nba-analysis = "nba_analysis.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["nba_analysis"]
include = ["nba_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]